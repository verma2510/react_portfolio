    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          var c = document.documentElement.classList;
          c.remove('light', 'dark');
          c.add(t);
        } catch (e) {}
      })();
    </script>
